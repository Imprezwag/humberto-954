<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Plano Humberto 954</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Architects+Daughter&family=IBM+Plex+Sans:wght@400;500&family=IBM+Plex+Mono:wght@500&display=swap">
<style>
:root{--paper:#ECEAEE;--sheet:#F7F6F9;--ink:#3D2F6E;--soft:#6E6390}
@media (prefers-color-scheme:dark){:root{--paper:#16131F;--sheet:#1F1B2B;--ink:#D9D1F2;--soft:#A49BC0;color-scheme:dark}}
*{box-sizing:border-box}
body{margin:0;background:var(--paper);color:var(--ink);font:16px/1.55 "IBM Plex Sans",system-ui,sans-serif}
main{max-width:1000px;margin:0 auto;padding:32px max(16px,env(safe-area-inset-left))}
h1{font:400 clamp(28px,5vw,42px)/1.1 "Architects Daughter",cursive;margin:0}
.sub{font:500 12px "IBM Plex Mono",monospace;letter-spacing:.06em;color:var(--soft);border-bottom:2px solid var(--ink);padding-bottom:12px;margin:4px 0 20px}
.sub a{color:inherit}
.dl{display:flex;flex-wrap:wrap;gap:10px;margin-bottom:20px}
.dl a{font:500 13px "IBM Plex Mono",monospace;border:1.5px solid var(--ink);background:var(--sheet);color:var(--ink);padding:8px 14px;text-decoration:none}
.dl a:hover,.dl a:focus-visible{background:var(--ink);color:var(--sheet)}
figure{margin:0;border:1.5px solid var(--ink);background:#fff}
figure img{display:block;width:100%;height:auto}
p{font-size:14px;color:var(--soft);max-width:70ch}
</style>
</head>
<body>
<main>
  <h1>Plano digitalizado</h1>
  <div class="sub"><a href="../">HUMBERTO 954</a> · PLANTA BAJA Y PLANTA ALTA · METROS</div>
  <div class="dl">
    <a href="Humberto954_plano.dxf" download>Descargar DXF (AutoCAD)</a>
    <a href="Humberto954_plano_vista.pdf">Abrir PDF</a>
  </div>
  <figure><a href="Humberto954_plano_vista.pdf"><img src="Humberto954_plano_vista.png" alt="Plano de planta baja y planta alta de Humberto 954"></a></figure>
  <p>Redibujado desde las cotas escritas del plano municipal de 1965. Los círculos rojos numerados marcan puntos a verificar. No es un relevamiento: medir en obra antes de usarlo para obra o compras.</p>
</main>
</body>
</html>
